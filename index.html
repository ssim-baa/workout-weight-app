<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Workout Logger</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Workout">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" href="icon-192.png">
    <style>
        :root {
            --primary: #0A84FF;
            --work: #30D158;
            --rest: #FF9F0A;
            --danger: #FF453A;

            --bg-color: #000000;
            --panel-bg: #1C1C1E;
            --border-color: #38383A;

            --text-primary: #FFFFFF;
            --text-secondary: #8E8E93;

            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            --radius: 20px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            margin: 0; padding: 0;
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column;
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        header {
            padding: 15px 25px;
            padding-top: calc(15px + env(safe-area-inset-top));
            padding-left: calc(25px + env(safe-area-inset-left));
            padding-right: calc(25px + env(safe-area-inset-right));
            height: calc(70px + env(safe-area-inset-top));
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .brand { font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 10px; color: var(--text-primary); }
        .total-time-badge {
            background: #2C2C2E; padding: 6px 12px; border-radius: 12px;
            font-variant-numeric: tabular-nums; font-weight: 600; color: var(--work); font-size: 0.9rem;
            border: 1px solid #3A3A3C;
        }
        .header-controls { display: flex; gap: 10px; }

        select.modern-select {
            padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-color);
            font-weight: 600; font-size: 0.9rem;
            background: #2C2C2E; color: white;
        }
        .btn-icon {
            background: #2C2C2E; border: 1px solid var(--border-color); color: white;
            width: 36px; height: 36px; border-radius: 10px; cursor: pointer; font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 16px;
            padding: 16px;
            overflow: hidden;
        }

        .panel {
            background: var(--panel-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex; flex-direction: column;
            border: 1px solid #2C2C2E;
        }

        .timeline-col { padding: 20px; overflow-y: auto; }
        .timeline-title { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }

        .timeline-item {
            position: relative; padding-left: 24px; margin-bottom: 24px;
            opacity: 0.4; transition: all 0.2s; cursor: pointer;
        }
        .timeline-item:hover { opacity: 0.7; }
        .timeline-item::before {
            content: ''; position: absolute; left: 7px; top: 24px; bottom: -30px; width: 2px; background: #333;
        }
        .timeline-item:last-child::before { display: none; }

        .timeline-marker {
            position: absolute; left: 0; top: 4px; width: 16px; height: 16px;
            border-radius: 50%; background: #444; border: 2px solid var(--panel-bg);
        }

        .timeline-content { display: flex; flex-direction: column; gap: 4px; }
        .t-name { font-weight: 600; font-size: 0.95rem; line-height: 1.3; color: var(--text-primary); }
        .t-info { font-size: 0.8rem; color: var(--text-secondary); }
        .t-rest { font-size: 0.75rem; color: var(--rest); font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .t-weight { font-size: 0.75rem; color: var(--primary); font-weight: 600; }

        .timeline-item.active { opacity: 1; }
        .timeline-item.active .timeline-marker { background: var(--work); box-shadow: 0 0 10px rgba(48, 209, 88, 0.4); }
        .timeline-item.active .t-name { color: var(--work); font-weight: 700; }
        .timeline-item.selected { opacity: 1; }
        .timeline-item.selected .t-name { text-decoration: underline; text-decoration-color: var(--primary); text-underline-offset: 4px; }
        .timeline-item.done { opacity: 0.3; }
        .timeline-item.done .t-name { text-decoration: line-through; }

        .content-col { background: transparent; box-shadow: none; border: none; gap: 16px; }

        .video-box {
            flex: 0 0 40%;
            background: black; border-radius: var(--radius); overflow: hidden; position: relative;
            box-shadow: var(--shadow); border: 1px solid #333;
        }
        .video-box iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:none; }

        .desc-box {
            flex: 1;
            background: var(--panel-bg); border-radius: var(--radius); padding: 25px;
            box-shadow: var(--shadow); overflow-y: auto; border: 1px solid #2C2C2E;
        }
        .desc-header { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .d-title { font-size: 2rem; font-weight: 800; margin: 0 0 8px 0; letter-spacing: -0.5px; color: white; }
        .d-badges { display: flex; gap: 8px; flex-wrap: wrap; }
        .d-badge { font-size: 0.75rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: #333; color: #ccc; }
        .d-badge.highlight { background: rgba(10, 132, 255, 0.2); color: var(--primary); }
        .d-text { font-size: 1.1rem; line-height: 1.6; color: #ddd; white-space: pre-wrap; }

        .dashboard-col {
            padding: 24px 20px; justify-content: space-between; align-items: center; text-align: center;
        }

        .timer-group { margin-top: 6px; width: 100%; }
        .status-text { font-size: 0.9rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        .main-timer {
            font-size: 5rem; font-weight: 900; line-height: 1; margin: 12px 0;
            font-variant-numeric: tabular-nums; letter-spacing: -2px; color: white;
        }

        .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; margin-bottom: 14px; }
        .stat-card { background: #2C2C2E; padding: 15px; border-radius: 16px; border: 1px solid #3A3A3C; }
        .stat-val { font-size: 1.5rem; font-weight: 800; color: white; }
        .stat-lbl { font-size: 0.7rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-top: 5px; }

        /* Rest-time set edit chip */
        .set-edit {
            display: none; width: 100%; background: #2C2C2E; border: 1px solid var(--rest);
            border-radius: 16px; padding: 12px 14px; margin-bottom: 14px;
        }
        .set-edit.show { display: block; }
        .set-edit-title { font-size: 0.75rem; font-weight: 700; color: var(--rest); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .set-edit-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .set-edit-row input {
            width: 72px; padding: 8px; text-align: center; font-size: 1.1rem; font-weight: 700;
            background: #1C1C1E; border: 1px solid #444; border-radius: 10px; color: white;
        }
        .set-edit-row .unit { font-size: 0.9rem; color: var(--text-secondary); font-weight: 700; }

        /* Stepper controls (weight ±0.5 / reps ±1) */
        .stepper-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
        .stepper-row:last-of-type { margin-bottom: 0; }
        .stepper-lbl { font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); width: 42px; text-align: left; flex: 0 0 auto; }
        .step-btn {
            width: 46px; height: 46px; border-radius: 12px; border: 1px solid #555; background: #3A3A3C; color: white;
            font-size: 1.7rem; font-weight: 700; line-height: 1; display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
        }
        .step-btn:active { background: var(--rest); color: black; }
        .step-val { flex: 1; text-align: center; font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; color: white; }
        .step-unit { font-size: 0.9rem; color: var(--text-secondary); font-weight: 700; margin-left: 3px; }
        .set-prev { margin-top: 12px; padding-top: 10px; border-top: 1px solid #3A3A3C; font-size: 0.75rem; color: var(--text-secondary); line-height: 1.6; text-align: left; }
        .set-prev b { color: var(--primary); font-weight: 700; }
        .set-prev .cur { color: var(--work); font-weight: 700; }

        /* Sync (v11) */
        .sync-badge { align-self: center; font-size: 0.75rem; font-weight: 700; padding: 6px 10px; border-radius: 10px; background: #2C2C2E; border: 1px solid #3A3A3C; color: var(--text-secondary); cursor: pointer; white-space: nowrap; }
        .sync-badge.ok { color: var(--work); }
        .sync-badge.wait { color: var(--rest); }
        .sync-badge.err { color: var(--danger); }
        .sync-box { background: #222; border: 1px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 16px; font-size: 0.85rem; line-height: 1.6; }
        .sync-status { color: var(--text-secondary); font-size: 0.8rem; white-space: pre-wrap; }
        .rh-row { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid #333; padding: 4px 0; }
        .rh-row:last-child { border-bottom: none; }
        .rh-row .rh-rev { font-family: ui-monospace, monospace; color: var(--text-secondary); }

        /* Previous-session reference in content view */
        .prev-ref { font-size: 0.85rem; background: #222; border: 1px solid #333; border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; line-height: 1.5; }
        .prev-ref.hidden { display: none; }
        .prev-ref .pr-title { color: var(--primary); font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .prev-ref .pr-body { color: #ddd; margin-top: 4px; font-variant-numeric: tabular-nums; }

        .btn-group { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        button { cursor: pointer; transition: transform 0.1s; }
        button:active { transform: scale(0.97); }
        .btn-main {
            height: 60px; border-radius: 16px; border: none; font-size: 1.2rem; font-weight: 700; color: black;
            background: var(--primary); box-shadow: 0 0 20px rgba(10, 132, 255, 0.3);
        }
        .btn-sub { height: 48px; border-radius: 14px; border: none; font-size: 1rem; font-weight: 600; background: #3A3A3C; color: white; }
        .btn-return {
            height: 40px; border-radius: 12px; border: 1px solid var(--primary); font-size: 0.9rem; font-weight: 600;
            background: transparent; color: var(--primary); margin-bottom: 6px; display: none;
        }

        .work-mode .main-timer { color: var(--work); text-shadow: 0 0 30px rgba(48, 209, 88, 0.3); }
        .rest-mode .main-timer { color: var(--rest); text-shadow: 0 0 30px rgba(255, 159, 10, 0.3); }
        .dashboard-col.work-mode { border-color: var(--work); }
        .dashboard-col.rest-mode { border-color: var(--rest); }

        @media (max-width: 1100px) {
            main { grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; }
            .timeline-col { grid-row: 1 / -1; }
            .content-col { grid-column: 2; }
            .dashboard-col { grid-column: 2; }
        }
        @media (max-width: 800px) {
            main { display: flex; flex-direction: column; overflow-y: auto; }
            .timeline-col { min-height: 150px; max-height: 250px; }
            .video-box { min-height: 250px; }
        }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 1000; justify-content: center; align-items: center; }
        .modal.open { display: flex; }
        .modal-content { background: #1C1C1E; width: 680px; max-width: 94vw; max-height: 88vh; border-radius: 24px; border: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; color: white; }
        .modal-header { padding: 18px 20px; background: #2C2C2E; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .modal-body { padding: 24px; overflow-y: auto; background: #1C1C1E; }

        .editor-row { display: flex; gap: 10px; margin-bottom: 12px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 10px; font-size: 1rem; background: #2C2C2E; color: white; }
        label.fld { display:block; font-size:0.7rem; color: var(--text-secondary); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
        .ex-item { background: #222; border: 1px solid #333; padding: 18px; border-radius: 16px; margin-bottom: 15px; }
        .section-label { font-size: 0.75rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin: 4px 0 10px; }

        .history-card { background: #222; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .h-date { font-weight: bold; font-size: 1.1rem; color: var(--primary); margin-bottom: 5px; }
        .h-title { color: #ccc; margin-bottom: 10px; font-size: 0.9rem; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .h-list { font-size: 0.85rem; color: #888; line-height: 1.5; }
        .empty-history { text-align: center; color: #666; padding: 30px; }

        /* Review sheet */
        .rev-ex { background:#222; border:1px solid #333; border-radius:14px; padding:14px; margin-bottom:14px; }
        .rev-ex-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
        .rev-ex-name { font-weight:700; font-size:1rem; }
        .rev-ex-token { font-size:0.8rem; color:var(--primary); font-weight:700; font-variant-numeric: tabular-nums; }
        .set-grid { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
        .set-cell { display:flex; align-items:center; gap:4px; background:#1A1A1A; border:1px solid #333; border-radius:10px; padding:6px 8px; }
        .set-cell span.si { font-size:0.7rem; color:var(--text-secondary); font-weight:700; min-width:14px; }
        .set-cell input { width:56px; padding:6px; text-align:center; font-size:0.95rem; font-weight:700; background:#2C2C2E; border:1px solid #444; border-radius:8px; }
        .set-cell .x { color:var(--text-secondary); font-weight:700; }
        .meta-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
        .tag-toggles { display:flex; gap:10px; }
        .tag-btn { flex:1; padding:10px; border-radius:10px; border:1px solid #444; background:#2C2C2E; color:#ccc; font-weight:700; font-size:0.9rem; }
        .tag-btn.on { border-color:var(--danger); color:var(--danger); background:rgba(255,69,58,0.12); }
        #exportPreview { height:180px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:0.8rem; line-height:1.5; white-space:pre; }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <span>💪</span> Fitness Logger
        <div class="total-time-badge" id="totalTime">00:00</div>
    </div>
    <div class="header-controls">
        <span class="sync-badge" id="syncBadge" onclick="openSettings()" title="동기화 상태"></span>
        <button class="btn-icon" onclick="openHistory()" title="History Log">📅</button>
        <select id="programSelect" class="modern-select"></select>
        <button class="btn-icon" onclick="openSettings()" title="Settings">⚙️</button>
    </div>
</header>

<main>
    <aside class="panel timeline-col" id="timelineContainer">
        <div class="timeline-title">Workout Routine</div>
        <div id="timelineList"></div>
    </aside>

    <section class="content-col panel">
        <div class="video-box">
            <iframe id="youtubeFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="desc-box">
            <div class="desc-header">
                <div class="d-badges">
                    <span class="d-badge highlight" id="exTypeBadge">-</span>
                    <span class="d-badge" id="exRestBadge">-</span>
                    <span class="d-badge" id="exWeightBadge" style="color:var(--work)">-</span>
                </div>
                <h1 id="exerciseTitle" class="d-title">Title</h1>
            </div>
            <div id="prevRef" class="prev-ref hidden">
                <div class="pr-title" id="prevRefTitle">📊 이전 세션</div>
                <div class="pr-body" id="prevRefBody"></div>
            </div>
            <div id="exerciseDesc" class="d-text"></div>
        </div>
    </section>

    <aside class="panel dashboard-col" id="statusCard">
        <div class="timer-group">
            <div id="statusIndicator" class="status-text">READY</div>
            <div class="main-timer" id="timerDisplay">00:00</div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-lbl">SET</div>
                <div class="stat-val"><span id="currentSet">-</span>/<span id="totalSet">-</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-lbl">TARGET</div>
                <div class="stat-val" id="targetValue">-</div>
            </div>
        </div>

        <div class="set-edit" id="setEdit">
            <div class="set-edit-title" id="setEditTitle">✓ 방금 세트</div>
            <div class="stepper-row">
                <span class="stepper-lbl">중량</span>
                <button class="step-btn" onclick="stepWeight(-0.5)">−</button>
                <div class="step-val"><span id="setWeight">0</span><span class="step-unit" id="setWeightUnit">kg</span></div>
                <button class="step-btn" onclick="stepWeight(0.5)">+</button>
            </div>
            <div class="stepper-row">
                <span class="stepper-lbl">횟수</span>
                <button class="step-btn" onclick="stepReps(-1)">−</button>
                <div class="step-val"><span id="setReps">0</span><span class="step-unit">회</span></div>
                <button class="step-btn" onclick="stepReps(1)">+</button>
            </div>
            <div class="set-prev" id="setPrev"></div>
        </div>

        <div class="btn-group">
            <button id="returnBtn" class="btn-return" onclick="returnToCurrent()">⬇ Return to Current</button>
            <button id="mainBtn" class="btn-main" onclick="handleMainButton()">START</button>
            <button id="resetBtn" class="btn-sub" onclick="resetWorkout()">RESET</button>
        </div>
    </aside>
</main>

<!-- Settings / Routine editor -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <button class="btn-sub" style="width:auto; padding:0 15px;" onclick="resetToDefaults()">Reset Defaults</button>
            <span style="font-weight:700;">Edit Routine</span>
            <div style="display:flex; gap:8px; align-items:center;">
                <button class="btn-main" style="flex:0; width:auto; padding:0 20px; font-size:1rem; color:black;" onclick="closeSettings()">Save</button>
                <button class="btn-icon" style="background:#3A3A3C;" onclick="cancelSettings()" title="저장하지 않고 닫기">✕</button>
            </div>
        </div>
        <div class="modal-body">
            <div style="margin-bottom: 18px;">
                <div class="editor-row">
                    <select id="editProgramSelect" onchange="loadEditor(this.value)"></select>
                </div>
                <div class="editor-row" style="display:grid; grid-template-columns: 2fr 1fr; gap:10px;">
                    <div>
                        <label class="fld">표시 이름 (Title)</label>
                        <input type="text" id="editTitle" onchange="updateProgramMeta('title', this.value)" placeholder="Day A: ...">
                    </div>
                    <div>
                        <label class="fld">routine_key (L3 Select)</label>
                        <input type="text" id="editRoutineKey" onchange="updateProgramMeta('routine_key', this.value)" placeholder="Day_A">
                    </div>
                </div>
                <div class="editor-row">
                    <input type="text" id="newProgramName" placeholder="New Routine Name">
                    <button class="btn-main" style="flex:1; height:44px; font-size:1rem;" onclick="addProgram()">Add</button>
                    <button class="btn-sub" style="flex:1; height:44px; background:var(--danger);" onclick="deleteProgram()">Del</button>
                </div>
            </div>

            <div id="exerciseListArea"></div>
            <button class="btn-sub" style="width:100%; padding:15px; margin-bottom:20px;" onclick="addExercise()">+ Add Exercise</button>

            <div class="section-label">루틴 반영 (JSON)</div>
            <div class="editor-row">
                <button class="btn-sub" style="flex:1;" onclick="exportRoutine()">📤 현재 루틴 복사</button>
                <button class="btn-sub" style="flex:1;" onclick="importRoutine()">📥 붙여넣기로 반영</button>
            </div>

            <div class="section-label">데이터 이전 · 백업</div>
            <div class="editor-row">
                <button class="btn-sub" style="flex:1;" onclick="importV9Storage()">⤵️ v9 데이터 가져오기</button>
            </div>
            <div class="editor-row">
                <button class="btn-sub" style="flex:1;" onclick="backupAll()">📦 전체 백업 복사</button>
                <button class="btn-sub" style="flex:1;" onclick="restoreAll()">♻️ 백업 복원</button>
            </div>

            <div class="section-label">루틴 변경 이력</div>
            <div id="routineHistoryArea" class="sync-box"></div>

            <div class="section-label">GitHub 동기화</div>
            <div class="sync-box">
                <div class="meta-grid">
                    <div><label class="fld">owner</label><input type="text" id="syncOwner" placeholder="ssim-baa" autocapitalize="off" autocorrect="off"></div>
                    <div><label class="fld">repo (비공개 데이터 저장소)</label><input type="text" id="syncRepo" placeholder="workout-weight-data" autocapitalize="off" autocorrect="off"></div>
                    <div><label class="fld">branch</label><input type="text" id="syncBranch" placeholder="main" autocapitalize="off" autocorrect="off"></div>
